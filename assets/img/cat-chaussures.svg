  </text>
  <text x="400" y="680" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" fill="#888888">
    Sélection privée sur commande personnalisée
  </text>

  <!-- VIP Badge Button -->
  <rect x="250" y="730" width="300" height="52" rx="26" fill="url(#orangeGrad)"/>
  <text x="400" y="762" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
    DISPONIBLE SUR WHATSAPP VIP
  </text>

  <!-- Bottom Details -->
  <text x="400" y="850" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" fill="#777777" letter-spacing="2">
    POINTURES &amp; MODÈLES SUR DEMANDE
  </text>
</svg>
